services:
  api:
    container_name: api
    build: ./api
    ports:
      - "5000:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - film-network

  db:
    container_name: db
    build: ./db
    ports:
      - "8000:8000"
    networks:
      - film-network

  interface:
    container_name: ihm
    build: ./ihm
    ports:
      - "7860:7860"
    depends_on:
      - api
      - db
    networks:
      - film-network

networks:
  film-network:
    driver: bridge


